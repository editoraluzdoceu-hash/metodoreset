function progress(){const all=allChapters();if(!all.length)return 0;const doneCount=all.filter(x=>state.done[chapterId(x.pi,x.ci)]).length;return Math.round(doneCount/all.length*100)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function updateStreak(){const today=todayStr();const last=state.streak.lastDate;if(last===today)return;const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const yStr=yesterday.toISOString().slice(0,10);if(last===yStr){state.streak.current+=1}else if(last!==today){if(last===null){state.streak.current=1}else{const diff=Math.floor((new Date(today)-new Date(last))/86400000);if(diff===1){state.streak.current+=1}else if(diff>1){state.streak.current=1}}}state.streak.lastDate=today;if(!state.streak.dates.includes(today))state.streak.dates.push(today);if(state.streak.dates.length>60)state.streak.dates=state.streak.dates.slice(-60);if(state.streak.current>state.streak.max)state.streak.max=state.streak.current;save()}

function getCurrentPlanDay(){const days=Object.keys(state.plan30.days).map(n=>parseInt(n)).sort((a,b)=>a-b);if(!days.length)return 1;const lastDone=days.filter(d=>{const ds=state.plan30.days[d];return ds.tasks.filter(Boolean).length===PLAN_30_DAYS.find(p=>p.day===d).tasks.length}).length;return Math.min(30,lastDone+1)}
function getPlanProgress(){const totalTasks=PLAN_30_DAYS.reduce((a,d)=>a+d.tasks.length,0);const done=Object.values(state.plan30.days).reduce((a,d)=>a+(d.tasks?d.tasks.filter(Boolean).length:0),0);return {done,total:totalTasks,pct:Math.round(done/totalTasks*100)}}

function nextToolSuggestionId(key){return 'next-tool-suggestion-'+String(key||'').replace(/[^a-z0-9_-]/gi,'-')}
function getBookToolEntry(idx){return BOOK_TOOL_SEQUENCE.find(item=>item.idx===idx)||null}
function getNextBookToolEntry(currentIdx){
  const pos=BOOK_TOOL_SEQUENCE.findIndex(item=>item.idx===currentIdx);
  if(pos<0)return null;
  for(let i=pos+1;i<BOOK_TOOL_SEQUENCE.length;i++){
    const item=BOOK_TOOL_SEQUENCE[i];
    if(!toolHasData('tool'+item.idx))return item;
  }
  return null;
}
function getFirstPendingBookTool(){return BOOK_TOOL_SEQUENCE.find(item=>!toolHasData('tool'+item.idx))||null}
function getFirstPendingBookToolIndex(){const item=getFirstPendingBookTool();return item?item.idx:-1}
function openNextBookTool(){const idx=getFirstPendingBookToolIndex();if(idx>-1)go('tool',idx);else go('plan')}
function renderNextToolSuggestion(currentIdx,key){
  if(currentIdx<0)return '';
  const id=nextToolSuggestionId(key);
  let content='';
  const currentStarted=toolHasData('tool'+currentIdx);
  const next=getNextBookToolEntry(currentIdx);
  if(currentStarted&&next){
    const nt=toolDefs[next.idx];
    content=`<div class="card" style="background:var(--bg);border:1px dashed var(--gold-deep)"><div style="font-weight:700;color:var(--cream)">💡 Próxima etapa do livro</div><div class="muted" style="font-size:13px">Você já começou <b style="color:var(--gold-soft)">${esc(toolDefs[currentIdx].title)}</b>. Quando fizer sentido, siga para <b style="color:var(--gold-soft)">${esc(nt.title)}</b>: ${esc(next.how)}</div><button class="primary" style="margin-top:10px" onclick="go('tool',${next.idx})">Ir para ${esc(nt.title)} →</button></div>`;
  }else if(currentStarted){
    content=`<div class="card" style="background:var(--success-bg);border-color:var(--success)"><div style="font-weight:700;color:var(--cream)">🎉 Você percorreu a trilha principal do livro</div><div class="muted" style="font-size:13px">Agora revise o que ainda precisar, abra o Plano de 30 Dias ou volte à ferramenta que combina com o seu momento.</div><div class="actions" style="margin-top:10px"><button class="ghost" onclick="go('plan')">Plano de 30 dias</button><button class="ghost" onclick="go('tools')">Ver ferramentas</button></div></div>`;
  }
  return `<div id="${id}" class="next-tool-suggestion">${content}</div>`;
}
function refreshNextToolSuggestion(key){
  if(!key||!key.startsWith('tool'))return;
  const currentIdx=idxFromKey(key);const old=document.getElementById(nextToolSuggestionId(key));
  if(!old)return;
  const holder=document.createElement('div');holder.innerHTML=renderNextToolSuggestion(currentIdx,key);
  const next=holder.firstElementChild;if(next)old.replaceWith(next);
}

function togglePlanTask(day,taskIdx){
  state.plan30.days[day]=state.plan30.days[day]||{tasks:[]};
  const before=state.plan30.days[day].tasks.filter(Boolean).length;
  const total=PLAN_30_DAYS.find(p=>p.day===day).tasks.length;
  state.plan30.days[day].tasks[taskIdx]=!state.plan30.days[day].tasks[taskIdx];
  if(!state.plan30.startedAt)state.plan30.startedAt=new Date().toISOString();
  const after=state.plan30.days[day].tasks.filter(Boolean).length;
  save();updateStreak();
  if(after===total&&before!==total){
    showConfetti();
    toast('🎉 Dia '+day+' completo! '+PLAN_30_DAYS.find(p=>p.day===day).title);
    setTimeout(()=>{if(day<30){openPlanDay(day+1)}else{checkCelebration(true)}},800);
  }else{
    render();
    const totalDone=Object.values(state.plan30.days).reduce((a,d)=>a+d.tasks.filter(Boolean).length,0);
    if(totalDone%5===0)toast('Progresso: '+totalDone+' tarefas concluídas! 🌱');
  }
}

function showConfetti(){
  const container=document.createElement('div');
  container.style.position='fixed';container.style.inset='0';container.style.pointerEvents='none';container.style.zIndex='80';
  container.innerHTML=Array(30).fill(0).map((_,i)=>`<div style="position:absolute;left:${Math.random()*100}%;top:-10px;font-size:${18+Math.random()*14}px;animation:confettiFall ${1.2+Math.random()}s ${Math.random()*0.3}s ease-out forwards">${['🎉','✨','🌱','💛','⭐'][Math.floor(Math.random()*5)]}</div>`).join('');
  document.body.appendChild(container);
  const style=document.createElement('style');style.textContent='@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}';
  document.head.appendChild(style);
  setTimeout(()=>{container.remove();style.remove()},2000);
}

function checkCelebration(force=false){
  const prog=getPlanProgress();
  if(prog.pct===100&&(!state.plan30.completedAt||force)){
    if(!force&&state.plan30.completedAt){
      const last=new Date(state.plan30.completedAt);
      if((Date.now()-last)<86400000)return;
    }
    state.plan30.completedAt=new Date().toISOString();
    save();
    showCelebrationScreen();
  }
}

function getHomeGreeting(){
  if(!state.profile)return null;
  const hour=new Date().getHours();
  let saudacao='Oi';if(hour<12)saudacao='Bom dia';else if(hour<18)saudacao='Boa tarde';else saudacao='Boa noite';
  const currentDay=getCurrentPlanDay();
  const prog=getPlanProgress();
  const streak=getStreak();
  const phase=PLAN_30_DAYS.find(d=>d.day===currentDay)?.phase||'Reconhecer';
  const title=PLAN_30_DAYS.find(d=>d.day===currentDay)?.title||'Começar';
  let msg='';
  if(prog.pct===0)msg=`que tal começar pelo Dia 1/30?`;
  else if(prog.pct===100)msg=`você completou os 30 dias — hora de celebrar! 🏆`;
  else msg=`você está no Dia ${currentDay}/30 — ${phase}: ${title}`;
  return {saudacao,msg,streak,phase,currentDay,prog};
}

function getNextToolSuggestion(){
  const next=getFirstPendingBookTool();
  if(next){
    const t=toolDefs[next.idx];
    return {idx:next.idx,icon:['🧩','📋','🎯','💪','🧠','❤️','💰','🔗','🔄','🛡️','💌','📅','🔍','🗓️'][next.idx]||'✦',title:t.title,reason:next.how,action:next.idx===0?'Começar agora':'Continuar trilha'};
  }
  const prog=getPlanProgress();
  if(prog.pct<100)return {idx:-1,icon:'📅',title:`Plano Dia ${getCurrentPlanDay()}/30`,reason:`Você tem ${prog.done}/${prog.total} tarefas — continue no Dia ${getCurrentPlanDay()}`,action:'Continuar plano'};

}

function chapters(){return `<div class="section-head"><div><div class="eyebrow" style="color:var(--gold)">Biblioteca</div><h2>Leia no seu ritmo</h2><p class="muted">Você pode voltar, marcar capítulos e usar as ferramentas quando fizer sentido.</p></div><input class="search" id="search" placeholder="Buscar capítulo ou palavra-chave…" oninput="debouncedSearch(this.value)"></div><div class="same-content-note">📘 <span>O PDF do Método RESET disponível para download é <b>o mesmo conteúdo</b> desta leitura — mesma jornada, só em outro formato.</span></div><div id="chapter-list">${chapterList()}</div>`}
function chapterList(q=''){return DATA.map((p,pi)=>{const cs=p.chapters.filter(c=>(c.title+' '+c.sections.map(s=>s.title+' '+s.paragraphs.join(' ')).join(' ')).toLowerCase().includes(q.toLowerCase()));if(!cs.length)return '';return `<div class="card" style="margin-bottom:16px"><div class="part-num">Parte ${pi+1}</div><h3>${esc(p.title.replace(/^PARTE [IVX]+ — /,'')||p.title)}</h3><div class="chapter-list">${cs.map(c=>{const ci=p.chapters.indexOf(c),id=chapterId(pi,ci);return `<button class="chapter-item" onclick="go('chapter',${pi},${ci})"><span>${state.done[id]?'✓':'○'}</span><b>${esc(c.title)}</b><small>${c.sections.length} seções</small></button>`}).join('')}</div></div>`}).join('')||'<div class="empty">Nenhum capítulo encontrado.</div>'}
function debouncedSearch(q){if(searchTimer)clearTimeout(searchTimer);searchTimer=setTimeout(()=>{document.getElementById('chapter-list').innerHTML=chapterList(q)},250)}
function filterChapters(q){document.getElementById('chapter-list').innerHTML=chapterList(q)}
function chapterJumpSelect(){const arr=allChapters();const opts=arr.map(x=>`<option value="${x.pi}-${x.ci}" ${x.pi===current.part&&x.ci===current.chapter?'selected':''}>${esc(x.p.title.replace(/^PARTE [IVX]+ — /,''))} — ${esc(x.c.title)}</option>`).join('');return `<select class="chapter-jump" aria-label="Ir para outro capítulo" onchange="const v=this.value.split('-').map(Number);go('chapter',v[0],v[1])">${opts}</select>`}
function readChapter(){const p=DATA[current.part],c=p.chapters[current.chapter],id=chapterId(current.part,current.chapter),done=!!state.done[id];let body='';let chapterToolIdx=-1;c.sections.forEach((s,si)=>{if(!s.title){body+=s.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('');return}const tool=getTool(s.title);if(tool&&chapterToolIdx===-1)chapterToolIdx=toolDefs.indexOf(tool);const summary=s.title.toLowerCase().includes('resumo acionável');body+=`<section class="section ${summary?'summary':''}"><h3>${esc(s.title)}</h3>${tool?renderTool(tool,'ch'+id+'-'+si):''}${s.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('')}</section>`});const toolCta=chapterToolIdx>-1?`<div class="chapter-tool-cta"><div><h4>✦ ${esc(toolDefs[chapterToolIdx].title)}</h4><p>${esc(toolDefs[chapterToolIdx].intro)}</p></div><button class="primary" onclick="go('tool',${chapterToolIdx})">Abrir ${esc(toolDefs[chapterToolIdx].title)} →</button></div>`:'';const arr=allChapters(),idx=arr.findIndex(x=>x.pi===current.part&&x.ci===current.chapter),prev=arr[idx-1],next=arr[idx+1];return `<div class="chapter-topbar"><button class="ghost back" onclick="go('chapters',${current.part})">← Voltar aos capítulos</button>${chapterJumpSelect()}</div><article class="chapter"><div class="part-num">${esc(p.title)}</div><h1 class="chapter-title">${esc(c.title)}</h1><div class="actions"><button class="${done?'secondary':'primary'}" onclick="toggleDone('${id}')">${done?'✓ Capítulo concluído':'Marcar como concluído'}</button><button class="ghost" onclick="go('tools')">Ver todas as ferramentas</button></div>${body}${toolCta}<div class="chapter-nav">${prev?`<button class="ghost" onclick="go('chapter',${prev.pi},${prev.ci})">← ${esc(prev.c.title)}</button>`:'<span></span>'}${next?`<button class="primary" onclick="go('chapter',${next.pi},${next.ci})"> ${esc(next.c.title)} →</button>`:''}</div></article>`}
function toggleDone(id){if(state.done[id])delete state.done[id];else state.done[id]=true;save();updateStreak();render();toast(state.done[id]?'Capítulo marcado como concluído':'Marca removida')}
function tools(){

  const currentLabel=next?toolDefs[next.idx].title:'trilha principal concluída';
  const recBanner=`<div class="tool-recommend-banner">✦ <span><b style="color:var(--gold-soft)">Trilha sugerida pelo livro:</b> ${esc(currentLabel)}. Use uma ferramenta por vez; ao começar, a próxima aparece automaticamente.</span><button class="ghost" style="margin-left:auto" onclick="openNextBookTool()">${next?'Abrir →':'Revisar →'}</button></div>`;

}

function planView(){const prog=getPlanProgress();return `<div class="section-head"><div><div class="eyebrow" style="color:var(--gold)">Próximos passos</div><h2>Plano de 30 dias — tracker real</h2><p class="muted">${prog.done} de ${prog.total} tarefas • ${prog.pct}% concluído • Dia atual ${getCurrentPlanDay()}/30 • 🔥 ${getStreak()} dias seguidos</p><div class="progress" style="margin-top:10px"><i style="width:${prog.pct}%"></i></div></div><div class="actions"><button class="ghost" onclick="resetPlan()">↺ Zerar plano</button><button class="secondary" onclick="exportData()">⬇ Backup</button>${prog.pct===100?`<button class="primary" onclick="showCelebrationScreen()">🏆 Ver conquista</button>`:''}</div></div>

function openPlanDay(day){const d=PLAN_30_DAYS.find(x=>x.day===day);if(!d)return;const dayState=state.plan30.days[day]||{tasks:[]};const el=document.getElementById('plan-day-detail');el.innerHTML=`<div class="card" style="margin-top:16px;max-width:640px"><div class="part-num">Dia ${d.day} • ${esc(d.phase)}</div><h3>${esc(d.title)}</h3><div class="muted" style="font-size:13px;margin-bottom:12px">Marque o que fez hoje. Retomar pela mínima em dia ruim ainda conta.</div>${d.tasks.map((task,i)=>`<label class="check"><input type="checkbox" ${dayState.tasks[i]?'checked':''} onchange="togglePlanTask(${day},${i})">${esc(task)}</label>`).join('')}<div class="actions" style="margin-top:12px"><button class="ghost" onclick="document.getElementById('plan-day-detail').innerHTML=''">Fechar</button><button class="primary" onclick="const nxt=${day+1};if(nxt<=30)openPlanDay(nxt);else toast('🎉 30 dias completos! Revise e celebre')">Próximo dia →</button></div></div>`;el.scrollIntoView({behavior:'smooth'})}
function wireForms(){document.querySelectorAll('[data-form]').forEach(e=>{const handler=()=>{const k=e.dataset.form;state.forms[k]=state.forms[k]||{};if(e.dataset.field){state.forms[k][e.dataset.field]=e.type==='checkbox'?e.checked:e.value;}if(e.dataset.check!==undefined){const isCustomCheck=e.dataset.check.startsWith('c_')||isNaN(parseInt(e.dataset.check));if(isCustomCheck){state.forms[k]['c_'+e.dataset.check]=e.checked}else{state.forms[k]['c'+e.dataset.check]=e.checked}saveFormCheck(k,e.dataset.check,e.checked);refreshNextToolSuggestion(k);return;}save();updateStreak();refreshNextToolSuggestion(k)};e.addEventListener('input',handler);e.addEventListener('change',handler)})}
function checkReminder(){if(!state.reminder||!state.reminder.enabled||!state.reminder.time)return;const now=new Date(),today=now.toISOString().slice(0,10);const[h,m]=state.reminder.time.split(':').map(Number);const target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);if(now>=target&&state.reminder.lastShown!==today){state.reminder.lastShown=today;save();fireReminder('Hora do seu momento RESET diário ✦')}}

function testReminder(){if('Notification' in window&&Notification.permission==='default'){Notification.requestPermission().then(()=>fireReminder('Teste de lembrete diário ✦'))}else{fireReminder('Teste de lembrete diário ✦')}}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function journal(){const q=(document.getElementById('journal-search')?.value||'').toLowerCase();let entries=(state.journal||[]).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(q)entries=entries.filter(e=>e.text.toLowerCase().includes(q)||(e.mood||'').toLowerCase().includes(q));const editing=journalEdit!==null? (state.journal||[]).find(e=>e.id===journalEdit):null;return `<div class="section-head"><div><div class="eyebrow" style="color:var(--gold)">Espaço livre</div><h2>Diário — ${(state.journal||[]).length} notas</h2><p class="muted">Escreva o que quiser, sem estrutura. Só para você — com busca, humor e histórico.</p></div><input class="search" id="journal-search" placeholder="Buscar nas notas…" value="${esc(q)}" oninput="renderJournalList(this.value)"></div><div class="card journal-box"><label style="display:block;font-weight:700;margin-bottom:6px">${editing?'Editando nota':'Nova nota'}</label><div class="mood-picker"><span class="muted" style="display:block;margin-bottom:8px;font-size:14px">Como você está agora? (opcional)</span><div class="mood-row">${MOODS.map(m=>`<button type="button" class="mood-btn ${journalMood===m.key?'active':''}" onclick="setJournalMood('${m.key}')" aria-label="${esc(m.label)}" title="${esc(m.label)}">${m.emoji}</button>`).join('')}</div></div><textarea id="journal-input" placeholder="O que está passando pela sua cabeça hoje?">${editing?esc(editing.text):''}</textarea><div class="actions" style="margin-top:10px"><button class="primary" onclick="saveJournalEntry()">${editing?'Salvar alterações':'Salvar nota'}</button>${editing?'<button class="ghost" onclick="cancelJournalEdit()">Cancelar</button>':''}</div></div><div id="journal-list" class="chapter-list">${entries.length?entries.map(e=>{const mo=MOODS.find(x=>x.key===e.mood);return `<div class="card journal-entry" style="margin-bottom:10px"><div class="muted">${mo?mo.emoji+' ':''}${fmtDate(e.createdAt)}${e.editedAt?' · editado':''}</div><p>${esc(e.text)}</p><div class="actions"><button class="ghost" onclick="editJournalEntry(${e.id})">Editar</button><button class="ghost" onclick="deleteJournalEntry(${e.id})">Excluir</button></div></div>`}).join(''):'<div class="empty">Nenhuma nota encontrada. Escreva a primeira acima.</div>'}</div>`}
function renderJournalList(q){const listEl=document.getElementById('journal-list');if(!listEl)return;let entries=(state.journal||[]).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));if(q)entries=entries.filter(e=>e.text.toLowerCase().includes(q.toLowerCase()));listEl.innerHTML=entries.length?entries.map(e=>{const mo=MOODS.find(x=>x.key===e.mood);return `<div class="card journal-entry" style="margin-bottom:10px"><div class="muted">${mo?mo.emoji+' ':''}${fmtDate(e.createdAt)}${e.editedAt?' · editado':''}</div><p>${esc(e.text)}</p><div class="actions"><button class="ghost" onclick="editJournalEntry(${e.id})">Editar</button><button class="ghost" onclick="deleteJournalEntry(${e.id})">Excluir</button></div></div>`}).join(''):'<div class="empty">Nenhuma nota encontrada.</div>'}
function setJournalMood(key){journalMood=journalMood===key?null:key;render()}
function saveJournalEntry(){const el=document.getElementById('journal-input'),text=el.value.trim();if(!text)return;state.journal=state.journal||[];if(journalEdit!==null){const entry=state.journal.find(e=>e.id===journalEdit);if(entry){entry.text=text;entry.mood=journalMood;entry.editedAt=new Date().toISOString()}journalEdit=null}else{state.journal.push({id:Date.now(),text,mood:journalMood,createdAt:new Date().toISOString()})}journalMood=null;save();updateStreak();render();toast('Nota salva')}
function editJournalEntry(id){journalEdit=id;const entry=(state.journal||[]).find(e=>e.id===id);journalMood=entry?entry.mood||null:null;render();window.scrollTo({top:0,behavior:'smooth'})}
function cancelJournalEdit(){journalEdit=null;journalMood=null;render()}
function deleteJournalEntry(id){if(!confirm('Excluir esta nota? Essa ação não pode ser desfeita.'))return;state.journal=(state.journal||[]).filter(e=>e.id!==id);save();render();toast('Nota excluída')}
function updateBackupHint(){const el=document.getElementById('backup-hint');if(!el)return;const last=state.toolMeta.lastBackup;if(!last){el.innerHTML='<div class="muted" style="font-size:11px;margin-top:8px">Nenhum backup ainda — exporte 1x por semana</div>'}else{const d=Math.floor((Date.now()-new Date(last))/86400000);el.innerHTML=`<div class="muted" style="font-size:11px;margin-top:8px">Último backup: ${d===0?'hoje':d+' dias atrás'} • ${new Date(last).toLocaleDateString('pt-BR')}</div>`}}

let quizStep=0,quizName='';
function quizStepHtml(){
  const dots=`<div class="quiz-dots"><span class="${quizStep===0?'on':''}"></span><span class="${quizStep===1?'on':''}"></span></div>`;
  if(quizStep===0){
    return `<div class="quiz-step active"><div class="quiz-mark">R</div>${dots}<h2>Bem-vindo(a) ao Método RESET</h2><p class="muted">Duas perguntas rápidas para deixar sua experiência mais direta ao ponto. Leva menos de 30 segundos.</p><label style="font-weight:700;display:block;margin-bottom:6px">Como podemos te chamar?</label><input type="text" id="quiz-name" maxlength="40" placeholder="Seu nome" value="${esc(quizName)}" autocomplete="given-name"><div class="quiz-actions"><button class="quiz-skip" onclick="skipQuiz()">Pular</button><button class="primary" onclick="quizNext()">Continuar →</button></div></div>`;
  }
  return `<div class="quiz-step active"><div class="quiz-mark">R</div>${dots}<h2>O que te trouxe até aqui${quizName?', '+esc(quizName):''}?</h2><p class="muted">Isso ajuda a sugerir por onde começar. Você pode mudar isso depois.</p><div class="motive-list">${MOTIVES.map(m=>`<button class="motive-opt" onclick="finishQuiz('${m.key}')"><span class="em">${m.icon}</span><span>${esc(m.label)}</span></button>`).join('')}</div><div class="quiz-actions"><button class="quiz-skip" onclick="quizStep=0;renderQuiz()">← Voltar</button><button class="quiz-skip" onclick="skipQuiz()">Pular</button></div></div>`;
}
function renderQuiz(){document.getElementById('quiz-overlay').innerHTML=`<div class="quiz-card">${quizStepHtml()}</div>`;if(quizStep===0)setTimeout(()=>{const el=document.getElementById('quiz-name');if(el)el.focus()},50)}
function openQuiz(reset){quizStep=0;quizName=reset&&state.profile?state.profile.name:'';document.getElementById('quiz-overlay').style.display='flex';renderQuiz()}
function closeQuizOverlay(){document.getElementById('quiz-overlay').style.display='none'}
function helpContent(){return `<div class="help-card"><button class="help-close" onclick="closeHelp()" aria-label="Fechar">✕</button><div class="quiz-mark">✦</div><h2>Você não precisa passar por isso sozinho(a)</h2><p class="muted">Se agora estiver difícil demais, ou se houver risco à sua segurança, este app não é suficiente — e tudo bem buscar ajuda agora. Ligar não custa nada e é sigiloso.</p><div class="help-item"><strong>CVV — Centro de Valorização da Vida</strong><p class="muted">Apoio emocional gratuito, sigiloso, 24 horas por dia, todos os dias.</p><div class="actions"><a class="primary" href="tel:188">Ligar para 188</a><a class="ghost" href="https://www.cvv.org.br/chat/" target="_blank" rel="noopener">Conversar por chat</a></div></div><div class="help-item"><strong>Risco imediato à vida</strong><p class="muted">Em emergência médica ou de segurança, ligue agora.</p><div class="actions"><a class="ghost" href="tel:192">SAMU — 192</a><a class="ghost" href="tel:190">Polícia — 190</a></div></div></div>`}
function openHelp(){document.getElementById('help-overlay').innerHTML=helpContent();document.getElementById('help-overlay').style.display='flex'}
function closeHelp(){document.getElementById('help-overlay').style.display='none'}
function quizNext(){const v=document.getElementById('quiz-name').value.trim();quizName=v;quizStep=1;renderQuiz()}
function finishQuiz(motiveKey){state.profile={name:quizName||'Você',motive:motiveKey};save();closeQuizOverlay();if(!state.tour.seen){openTour()}else{openNextBookTool();toast('Tudo pronto, '+state.profile.name+'!')}}
function skipQuiz(){state.profile=state.profile||{name:'Você',motive:null};save();closeQuizOverlay();if(!state.tour.seen){openTour()}else{render()}}

function openTour(){
  state.tour.seen=false;state.tour.step=0;
  const overlay=document.getElementById('tour-overlay');
  overlay.style.display='flex';
  renderTour();
}
function closeTour(){
  state.tour.seen=true;save();
  document.getElementById('tour-overlay').style.display='none';
  openNextBookTool();
  toast('Tour concluído — bora começar! 🌱');
}
function renderTour(){
  const steps=[
    {icon:'📘',title:'Livro em 15 capítulos',desc:'Leia no seu ritmo. Marque como concluído, busque por palavra-chave e use as ferramentas dentro dos capítulos.'},
    {icon:'✦',title:'14 Ferramentas interativas',desc:'Matriz da Queda, Mapa de Emoções com roda, Financeiro com calculadora, Construtor de Hábito com tracker 21 dias — tudo salvo localmente.'},
    {icon:'✎',title:'Diário com humor',desc:'Espaço livre com busca, filtro por humor e histórico. Escreva o que quiser, sem estrutura.'},
    {icon:'◷',title:'Plano 30 dias + streak',desc:'Tracker real de 30 dias com tarefas diárias, confete ao completar o dia, streak 🔥 e tela de conquista ao final.'}
  ];
  const s=steps[state.tour.step];
  const overlay=document.getElementById('tour-overlay');
  overlay.innerHTML=`<div class="quiz-card" style="max-width:420px"><div class="quiz-dots">${steps.map((_,i)=>`<span class="${i===state.tour.step?'on':''}"></span>`).join('')}</div><div style="font-size:36px;margin:12px 0">${s.icon}</div><h2>${s.title}</h2><p class="muted">${s.desc}</p><div class="quiz-actions"><button class="quiz-skip" onclick="closeTour()">Pular tour</button><div style="display:flex;gap:8px">${state.tour.step>0?`<button class="ghost" onclick="state.tour.step--;renderTour()">← Voltar</button>`:''}${state.tour.step<steps.length-1?`<button class="primary" onclick="state.tour.step++;renderTour()">Próximo →</button>`:`<button class="primary" onclick="closeTour()">Começar →</button>`}</div></div></div>`;
}

function initNativeFullscreen(){try{if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()){const SB=window.Capacitor.Plugins&&window.Capacitor.Plugins.StatusBar;if(SB){SB.setOverlaysWebView({overlay:true});SB.hide();}}}catch(e){}}
render();checkReminder();setInterval(checkReminder,60000);initNativeFullscreen();updateBackupHint();updateStreak();
if(!state.profile){setTimeout(()=>openQuiz(false),350)}else if(!state.tour.seen){setTimeout(()=>openTour(),600)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('service-worker.js').catch(()=>{})})}
window.addEventListener('resize',()=>{if(window.innerWidth>800){document.getElementById('side').style.display='';document.getElementById('mobile-overlay').classList.remove('show')}});

</script>

</body>
</html>
